name: ci

on:
  push:
    branches: [main, codex/simplify-release-20260913]
  pull_request:
  workflow_call:
    inputs:
      release:
        description: Linux checks run in the release build jobs
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  LIBGHOSTTY_VT_SYS_OPTIMIZE: ReleaseFast

jobs:
  check:
    if: ${{ inputs.release }}
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/beta_compatibility.py --base "$COMPATIBILITY_BASE"
        env:
          COMPATIBILITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: python3 -m unittest discover -s scripts/tests -v
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo build --locked -p muxy-cli -p muxy-server
      - run: cargo test --locked --workspace --all-features
      - run: python3 scripts/smoke-desktop-tui.py
      - run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  headless:
    if: ${{ !inputs.release }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config zsh fish binutils vim-tiny less
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: headless-${{ matrix.target }}-glibc-2.35-baseline
      - run: python3 scripts/check-headless.py --target "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: headless-${{ matrix.target }}
          path: target/headless/
          if-no-files-found: error

  headless-newer:
    if: ${{ !inputs.release }}
    needs: headless
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y zsh fish binutils vim-tiny less
      - uses: actions/download-artifact@v4
        with:
          name: headless-${{ matrix.target }}
          path: floor-runtime
      - run: chmod +x floor-runtime/muxy floor-runtime/muxy-server
      - run: python3 scripts/check-headless.py --target "${{ matrix.target }}" --runtime-binary floor-runtime/muxy
