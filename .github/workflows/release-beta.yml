name: Verify release packages (no publication)

on:
  push:
    branches: [codex/unified-cli-checkpoint-c-20260912]

permissions:
  contents: read

# Different commits can finish independently; reruns of one commit cannot race.
concurrency:
  group: release-beta-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  LIBGHOSTTY_VT_SYS_OPTIMIZE: ReleaseFast
  MACOSX_DEPLOYMENT_TARGET: '14.0'

jobs:
  validate:
    if: github.repository == 'muxy-app/muxy' && !github.event.deleted
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Compute beta version
        id: version
        run: python3 scripts/beta_release.py version >> "$GITHUB_OUTPUT"
      - name: Reject a reused version from different history
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            if [[ "$(git rev-parse "refs/tags/$TAG^{}")" != "$GITHUB_SHA" ]]; then
              echo "Error: $TAG already points to a different commit" >&2
              exit 1
            fi
          fi

  build:
    needs: [validate]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
            runner: macos-15
          - arch: x86_64
            target: x86_64-apple-darwin
            runner: macos-15-intel
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          targets: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: beta-${{ matrix.target }}-baseline
      - name: Stamp the build version without committing a bump
        run: python3 scripts/beta_release.py stamp "$VERSION"
      - name: Import signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/muxy-beta-signing.keychain-db"
          : "${CERTIFICATE_P12:?Developer ID certificate is required}"
          : "${CERTIFICATE_PASSWORD:?Certificate password is required}"
          : "${KEYCHAIN_PASSWORD:?Keychain password is required}"
          umask 077
          CERTIFICATE="$RUNNER_TEMP/muxy-beta-certificate.p12"
          trap 'rm -f "$CERTIFICATE"' EXIT
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$CERTIFICATE"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          security import "$CERTIFICATE" -k "$KEYCHAIN_PATH" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
      - name: Resolve signing identity
        id: identity
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/muxy-beta-signing.keychain-db"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk '/Developer ID Application/ {print $2; exit}')
          if [[ -z "$IDENTITY" ]]; then
            echo "Error: no Developer ID Application identity found" >&2
            exit 1
          fi
          echo "name=$IDENTITY" >> "$GITHUB_OUTPUT"
      - name: Build and sign desktop and standalone client/server pair
        env:
          SIGN_IDENTITY: ${{ steps.identity.outputs.name }}
        run: bash scripts/build-release.sh --arch "$ARCH" --version "$VERSION" --sign-identity "$SIGN_IDENTITY"
      - name: Notarize and verify DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/notarize-release.sh "target/beta/$VERSION/$ARCH/Muxy-$VERSION-$ARCH.dmg"
      - name: Notarize standalone ZIP and verify extracted executables
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/notarize-release.sh "target/beta/$VERSION/$ARCH/muxy-$VERSION-macos-$ARCH.zip"
      - name: Verify packaged pair, desktop bytes and standalone installation
        run: >-
          python3 scripts/verify-release-package.py
          "target/beta/$VERSION/$ARCH/muxy-$VERSION-macos-$ARCH.zip"
          --version "$VERSION" --dmg "target/beta/$VERSION/$ARCH/Muxy-$VERSION-$ARCH.dmg"
          --notarized --runtime-tests
      - name: Upload notarized desktop and standalone archives
        uses: actions/upload-artifact@v4
        with:
          name: beta-distribution-macos-${{ matrix.arch }}
          path: |
            target/beta/${{ env.VERSION }}/${{ matrix.arch }}/*.dmg
            target/beta/${{ env.VERSION }}/${{ matrix.arch }}/muxy-*-macos-*.zip
          if-no-files-found: error
          retention-days: 7
      - name: Upload app and server debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: beta-symbols-${{ matrix.arch }}
          path: |
            target/beta/${{ env.VERSION }}/${{ matrix.arch }}/*-symbols.zip
            target/beta/${{ env.VERSION }}/${{ matrix.arch }}/*-dependencies.txt
          if-no-files-found: error
          retention-days: 30
      - name: Remove signing keychain
        if: always()
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/muxy-beta-signing.keychain-db"
          if [[ -f "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
          rm -f "$RUNNER_TEMP/muxy-beta-certificate.p12"

  build-linux:
    needs: [validate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - arch: arm64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config zsh fish binutils vim-tiny less
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: beta-${{ matrix.target }}-glibc-2.35-baseline
      - run: python3 scripts/beta_release.py stamp "$VERSION"
      - name: Build and audit the native glibc 2.35 pair
        run: bash scripts/build-cli-linux.sh "$ARCH" "$VERSION"
      - name: Verify packaged pair and standalone installation
        run: >-
          python3 scripts/verify-release-package.py
          "target/beta/$VERSION/linux-$ARCH/muxy-$VERSION-linux-$ARCH.tar.gz"
          --version "$VERSION" --runtime-tests
      - uses: actions/upload-artifact@v4
        with:
          name: beta-distribution-linux-${{ matrix.arch }}
          path: target/beta/${{ env.VERSION }}/linux-${{ matrix.arch }}/muxy-*-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: beta-symbols-linux-${{ matrix.arch }}
          path: |
            target/beta/${{ env.VERSION }}/linux-${{ matrix.arch }}/*-symbols.tar.gz
            target/beta/${{ env.VERSION }}/linux-${{ matrix.arch }}/*-audit.txt
          if-no-files-found: error
          retention-days: 30

  verify-linux-newer:
    needs: [validate, build-linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config zsh fish binutils vim-tiny less
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: beta-newer-${{ matrix.arch }}-baseline
      - run: python3 scripts/beta_release.py stamp "$VERSION"
      - uses: actions/download-artifact@v4
        with:
          name: beta-distribution-linux-${{ matrix.arch }}
          path: artifacts
      - name: Verify the exact floor-built archive on newer userspace
        run: >-
          python3 scripts/verify-release-package.py
          "artifacts/muxy-$VERSION-linux-$ARCH.tar.gz" --version "$VERSION" --runtime-tests

